name: business_management_system
description: JOLINX Business OS — offline-first business management for East African shops.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & routing (ADR-0010: Riverpod; go_router kept)
  flutter_riverpod: ^2.6.1
  go_router: ^13.0.0

  # Networking
  dio: ^5.7.0

  # Security
  flutter_secure_storage: ^9.2.4

  # Environment & utilities
  flutter_dotenv: ^5.2.1
  intl: ^0.20.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0

  # Local database (offline-first, M5): Drift + SQLCipher at rest.
  # Key never leaves flutter_secure_storage; see core/local/db_key_store.dart.
  # NOTE: sqlcipher_flutter_libs REPLACES sqlite3_flutter_libs entirely — both
  # ship the same plugin class, so sqlite3_flutter_libs (and drift_flutter,
  # which drags it in transitively) must NOT be present.
  drift: ^2.21.0
  sqlcipher_flutter_libs: ^0.6.8
  path: ^1.9.0
  path_provider: ^2.1.4
  sqlite3: ^2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Test-only: lets tests fake secure storage via its platform interface.
  flutter_secure_storage_platform_interface: ^1.1.2
  build_runner: ^2.4.11
  drift_dev: ^2.21.0
  flutter_lints: ^3.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
