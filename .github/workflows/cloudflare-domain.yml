name: Configure Cloudflare Pages Custom Domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Custom domain to attach (e.g. staging.joberthix.xyz)'
        required: true
        default: 'staging.joberthix.xyz'
      project_name:
        description: 'Cloudflare Pages project name'
        required: true
        default: 'jolinx-app'

jobs:
  configure-domain:
    name: Attach Domain to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Attach Custom Domain via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f30c28de87437abbe6b487082c163cc0' }}
          DOMAIN: ${{ inputs.domain }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          echo "Attaching domain '$DOMAIN' to Cloudflare Pages project '$PROJECT_NAME'..."

          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${DOMAIN}\"}")

          echo "Response: $RESPONSE"

          SUCCESS=$(echo "$RESPONSE" | grep -E '"success"\s*:\s*true' || true)
          ALREADY_EXISTS=$(echo "$RESPONSE" | grep -iE 'already added|already exists' || true)

          if [ -n "$SUCCESS" ] || [ -n "$ALREADY_EXISTS" ]; then
            echo "::notice title=Domain Configured::Custom domain '$DOMAIN' is linked to '$PROJECT_NAME'!"
          else
            echo "::error::Failed to attach domain: $RESPONSE"
            exit 1
          fi

          echo "Setting production_branch of '$PROJECT_NAME' to 'staging' so custom domains serve it..."
          BRANCH_RES=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch": "staging"}')
          echo "Branch Update: $BRANCH_RES"

          echo "Ensuring DNS CNAME record exists in Cloudflare zone..."
          ZONE_ID="5437d5518f6a7c86d595e9d77e91d76c"
          DNS_RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"CNAME\",\"name\":\"${DOMAIN}\",\"content\":\"${PROJECT_NAME}.pages.dev\",\"ttl\":1,\"proxied\":true}")

          echo "DNS Response: $DNS_RESPONSE"
