name: Configure Cloudflare Pages Custom Domain

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (inspect | setup_verify | attach_pages)'
        required: true
        default: 'inspect'
        type: choice
        options:
          - inspect
          - setup_verify
          - attach_pages
      subdomain:
        description: 'Subdomain prefix for verification (e.g. verify, v, check)'
        required: false
        default: 'verify'
      domain:
        description: 'Custom domain to attach to Pages (e.g. staging.joberthix.xyz)'
        required: false
        default: 'staging.joberthix.xyz'
      project_name:
        description: 'Cloudflare Pages project name'
        required: false
        default: 'jolinx-app'

jobs:
  configure-domain:
    name: Cloudflare Management
    runs-on: ubuntu-latest
    steps:
      - name: Execute Cloudflare Action
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f30c28de87437abbe6b487082c163cc0' }}
          ACTION: ${{ inputs.action }}
          SUBDOMAIN: ${{ inputs.subdomain }}
          DOMAIN: ${{ inputs.domain }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          echo "=========================================================="
          echo "1. Checking Cloudflare Zones (Domains)..."
          echo "=========================================================="
          ZONES_RES=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          echo "Raw Zones response: $ZONES_RES"

          PRIMARY_ZONE_ID=$(echo "$ZONES_RES" | jq -r '.result[0].id // "5437d5518f6a7c86d595e9d77e91d76c"')
          PRIMARY_ZONE_NAME=$(echo "$ZONES_RES" | jq -r '.result[0].name // "joberthix.xyz"')
          echo "Active Zone: $PRIMARY_ZONE_NAME (ID: $PRIMARY_ZONE_ID)"

          echo ""
          echo "=========================================================="
          echo "2. Listing Existing DNS Records for $PRIMARY_ZONE_NAME..."
          echo "=========================================================="
          DNS_RES=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${PRIMARY_ZONE_ID}/dns_records?per_page=50" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          echo "Raw DNS response: $DNS_RES"

          echo ""
          echo "=========================================================="
          echo "3. Listing Cloudflare Worker Scripts..."
          echo "=========================================================="
          WORKERS_RES=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          echo "Raw Workers response: $WORKERS_RES"

          echo ""
          echo "=========================================================="
          echo "4. Listing Worker Routes for $PRIMARY_ZONE_NAME..."
          echo "=========================================================="
          ROUTES_RES=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${PRIMARY_ZONE_ID}/workers/routes" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          echo "Raw Routes response: $ROUTES_RES"

          if [ "$ACTION" = "setup_verify" ]; then
            TARGET_DOMAIN="${SUBDOMAIN}.${PRIMARY_ZONE_NAME}"
            echo ""
            echo "=========================================================="
            echo "5. Setting Up Subdomain: $TARGET_DOMAIN"
            echo "=========================================================="

            WORKER_SCRIPT=$(echo "$WORKERS_RES" | jq -r '.result[]? | select((.id // .name) | contains("api") or contains("router")) | (.id // .name)' | head -n 1)
            if [ -z "$WORKER_SCRIPT" ]; then
              WORKER_SCRIPT=$(echo "$WORKERS_RES" | jq -r '.result[0].id // .result[0].name // "jolinx-api-router"')
            fi
            echo "Target Worker Script: $WORKER_SCRIPT"

            EXISTING_DNS_ID=$(echo "$DNS_RES" | jq -r --arg td "$TARGET_DOMAIN" '.result[]? | select(.name == $td) | .id')

            if [ -n "$EXISTING_DNS_ID" ]; then
              echo "DNS record for $TARGET_DOMAIN already exists (ID: $EXISTING_DNS_ID)."
            else
              echo "Creating proxied dummy DNS A record for $TARGET_DOMAIN (192.0.2.1)..."
              CREATE_DNS_RES=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${PRIMARY_ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"${SUBDOMAIN}\",\"content\":\"192.0.2.1\",\"ttl\":1,\"proxied\":true}")
              echo "Create DNS result: $CREATE_DNS_RES"
            fi

            EXISTING_ROUTE_ID=$(echo "$ROUTES_RES" | jq -r --arg pat "${TARGET_DOMAIN}/*" '.result[]? | select(.pattern == $pat) | .id')

            if [ -n "$EXISTING_ROUTE_ID" ]; then
              echo "Worker route for ${TARGET_DOMAIN}/* already exists (ID: $EXISTING_ROUTE_ID)."
            else
              echo "Creating Worker route: ${TARGET_DOMAIN}/* -> $WORKER_SCRIPT..."
              CREATE_ROUTE_RES=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${PRIMARY_ZONE_ID}/workers/routes" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"pattern\":\"${TARGET_DOMAIN}/*\",\"script\":\"${WORKER_SCRIPT}\"}")
              echo "Create Route result: $CREATE_ROUTE_RES"
            fi

            echo ""
            echo "::notice title=Subdomain Configured::https://${TARGET_DOMAIN} route created on Cloudflare pointing to $WORKER_SCRIPT!"
          fi
