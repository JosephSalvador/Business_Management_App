name: jolinx_app
description: JOLINX Business OS — offline-first business management for East African shops.

publish_to: 'none'
version: 1.0.0+67

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & routing (ADR-0010: Riverpod; go_router kept)
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  web: '>=0.5.1 <2.0.0'

  # Networking
  dio: ^5.7.0

  # Security
  flutter_secure_storage: ^11.0.0
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Environment & utilities
  flutter_dotenv: ^6.0.1
  intl: ^0.20.0
  uuid: ^4.5.1
  connectivity_plus: ^7.3.1
  fl_chart: ^1.2.0

  # Local database (offline-first, M5): Drift + SQLCipher at rest.
  # Key never leaves flutter_secure_storage; see core/local/db_key_store.dart.
  # Native: sqlcipher_flutter_libs provides encrypted SQLite.
  # Web: WasmDatabase uses unencrypted SQLite via WebAssembly.
  # NOTE: sqlcipher_flutter_libs REPLACES sqlite3_flutter_libs entirely.
  drift: ^2.21.0
  sqlcipher_flutter_libs: ^0.7.0+eol
  path: ^1.9.0
  path_provider: ^2.1.4
  sqlite3: ^3.5.2
  share_plus: ^13.3.0
  flutter_bluetooth_printer: ^2.24.0
  pdf: ^3.11.2
  qr: ^3.0.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Test-only: lets tests fake secure storage via its platform interface.
  flutter_secure_storage_platform_interface: ^2.0.3
  build_runner: ^2.4.11
  drift_dev: ^2.21.0
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/jolinx_logo.png
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700

