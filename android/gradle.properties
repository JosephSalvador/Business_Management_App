org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# AGP 9 is tested and documented for JDK 17; the system default (JDK 25) can
# hang the build. Pin the Gradle daemon to JDK 17.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
# AGP 9's built-in Kotlin is used (android/app/build.gradle.kts no longer
# applies kotlin-android). Requires Flutter >= 3.47 on AGP 9+.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
