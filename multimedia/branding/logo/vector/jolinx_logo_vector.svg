<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d4a" />
      <stop offset="50%" stop-color="#0c235c" />
      <stop offset="100%" stop-color="#050e26" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="emblemGrad" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F0F8FF" />
      <stop offset="80%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="1024" fill="#061028" />

  <!-- Outer Mat Squircle -->
  <rect x="80" y="80" width="864" height="864" rx="220" fill="url(#bgGrad)" stroke="#1a3575" stroke-width="4" />
  
  <!-- Subtle Top Specular Glass Bevel Arc -->
  <path d="M 120 300 C 120 180 180 120 300 120 L 724 120 C 844 120 904 180 904 300" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" />

  <!-- Ambient Neon Aura Backlight -->
  <g filter="url(#softGlow)" opacity="0.75">
    <!-- Bar 1 Glow -->
    <rect x="330" y="480" width="80" height="120" rx="40" fill="url(#glowGrad)" />
    <!-- Bar 2 Glow -->
    <rect x="450" y="400" width="80" height="260" rx="40" fill="url(#glowGrad)" />
    <!-- J Hook Glow -->
    <path d="M 330 680 C 330 780 430 800 570 800 C 630 800 650 750 650 650 L 650 320" fill="none" stroke="url(#glowGrad)" stroke-width="80" stroke-linecap="round" />
    <!-- Arrow Glow -->
    <polygon points="650,210 540,340 760,340" fill="url(#glowGrad)" />
  </g>

  <!-- Crisp Vector Emblem: Rising Growth J -->
  <g fill="url(#emblemGrad)">
    <!-- Pillar 1 (Left Short Growth Bar) -->
    <rect x="330" y="480" width="76" height="120" rx="38" />

    <!-- Pillar 2 (Center Medium Growth Bar) -->
    <rect x="460" y="390" width="76" height="270" rx="38" />

    <!-- Pillar 3 & J-Hook (Main Ascent Stem + Lower Curve) -->
    <path d="M 340 670 C 340 780 440 790 560 790 C 620 790 640 740 640 660 L 640 330" fill="none" stroke="url(#emblemGrad)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrowhead Peak -->
    <polygon points="640,210 530,340 750,340" />
  </g>

  <!-- Brand Typography -->
  <text x="512" y="930" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="12" text-anchor="middle">JOLINX</text>
  <text x="512" y="965" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#00FFA3" letter-spacing="8" text-anchor="middle">BUSINESS OS</text>
</svg>
