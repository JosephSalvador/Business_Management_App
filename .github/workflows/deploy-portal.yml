name: Deploy Back-Office Portal to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    paths:
      - 'portal/**'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Environment (production or staging)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy-portal:
    name: Build & Deploy Portal to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: portal/package.json

      - name: Determine Target Environment
        id: env
        run: |
          TARGET="${{ inputs.target_env }}"
          if [ -z "$TARGET" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
              TARGET="production"
            else
              TARGET="staging"
            fi
          fi

          if [ "$TARGET" = "production" ]; then
            CF_BRANCH="main"
          else
            CF_BRANCH="staging"
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "cf_branch=$CF_BRANCH" >> "$GITHUB_OUTPUT"
          echo "::notice title=Portal Deployment::Environment: $TARGET | Cloudflare Branch: $CF_BRANCH"

      - name: Install Dependencies & Build Portal
        env:
          VITE_API_BASE_URL: ${{ steps.env.outputs.target == 'production' && 'https://api.joberthix.xyz' || 'https://jolinx-api-staging.kindsky-ea584b9f.centralindia.azurecontainerapps.io' }}
        run: |
          cd portal
          npm install
          npm run build

      - name: Deploy to Cloudflare Pages & Bind Custom Domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f30c28de87437abbe6b487082c163cc0' }}
          PRIMARY_ZONE_ID: '5437d5518f6a7c86d595e9d77e91d76c'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Ensuring Cloudflare Pages project 'jolinx-portal' exists..."
            npx wrangler pages project create jolinx-portal --production-branch=main 2>&1 || true

            echo "Deploying portal/dist to Cloudflare Pages project 'jolinx-portal' (branch: ${{ steps.env.outputs.cf_branch }})..."
            npx wrangler pages deploy portal/dist \
              --project-name=jolinx-portal \
              --branch="${{ steps.env.outputs.cf_branch }}" \
              --commit-dirty=true

            if [ "${{ steps.env.outputs.cf_branch }}" = "staging" ]; then
              echo "Also syncing staging portal build to main branch of jolinx-portal so custom domains resolve immediately..."
              npx wrangler pages deploy portal/dist \
                --project-name=jolinx-portal \
                --branch="main" \
                --commit-dirty=true
            fi

            echo "Attaching custom domains portal-staging.joberthix.xyz and portal.joberthix.xyz to jolinx-portal..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/jolinx-portal/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name": "portal-staging.joberthix.xyz"}' || true

            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/jolinx-portal/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name": "portal.joberthix.xyz"}' || true

            echo "Ensuring proxied CNAME DNS records exist in zone joberthix.xyz..."
            DNS_RES=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${PRIMARY_ZONE_ID}/dns_records?per_page=100" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")

            for SUB in "portal-staging:staging.jolinx-portal.pages.dev" "portal:jolinx-portal.pages.dev"; do
              SUB_NAME="${SUB%%:*}"
              SUB_TARGET="${SUB#*:}"
              FULL_DOMAIN="${SUB_NAME}.joberthix.xyz"
              EXISTING_ID=$(echo "$DNS_RES" | jq -r --arg d "$FULL_DOMAIN" '.result[]? | select(.name == $d) | .id' | head -n 1)
              if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
                echo "Updating CNAME $FULL_DOMAIN -> $SUB_TARGET (ID: $EXISTING_ID)..."
                curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${PRIMARY_ZONE_ID}/dns_records/${EXISTING_ID}" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"type\":\"CNAME\",\"name\":\"${SUB_NAME}\",\"content\":\"${SUB_TARGET}\",\"ttl\":1,\"proxied\":true}" || true
              else
                echo "Creating CNAME $FULL_DOMAIN -> $SUB_TARGET..."
                curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${PRIMARY_ZONE_ID}/dns_records" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"type\":\"CNAME\",\"name\":\"${SUB_NAME}\",\"content\":\"${SUB_TARGET}\",\"ttl\":1,\"proxied\":true}" || true
              fi
            done
          else
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing. Add it in GitHub repository secrets."
            exit 1
          fi

