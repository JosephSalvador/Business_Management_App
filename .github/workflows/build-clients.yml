name: Build All Client Platforms

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Primary Production HTTPS API Base URL'
        required: true
        default: 'https://api.joberthix.xyz'
      api_fallback_url:
        description: 'Fallback Production HTTPS API Base URL'
        required: false
        default: 'https://jolinx-api-router.josephsalvador662.workers.dev'
      deploy_target:
        description: 'Cloudflare Pages Web Target (Staging vs Production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      build_all_platforms:
        description: 'Build Desktop (Windows, macOS, Linux) & iOS in addition to Android and Web'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'web/**'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-clients.yml'

permissions:
  contents: write

env:
  API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://api.joberthix.xyz' }}
  API_FALLBACK_URL: ${{ inputs.api_fallback_url || vars.API_FALLBACK_URL || 'https://jolinx-api-router.josephsalvador662.workers.dev' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Android APK + Web Bundle + Linux Desktop (Ubuntu Runner)
  # ──────────────────────────────────────────────────────────────────────────
  build-android-web-linux:
    name: Build Android, Web & Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux Desktop build dependencies
        if: (github.event_name == 'workflow_dispatch' && inputs.build_all_platforms == true) || startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Determine Target Environment & API Routing
        id: cf_env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.deploy_target }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET="production"
          else
            TARGET="staging"
          fi

          if [ "$TARGET" = "production" ]; then
            CF_BRANCH="main"
            APP_ENV="production"
            API_URL="https://api.joberthix.xyz"
            FALLBACK_URL="https://jolinx-api.kindsky-ea584b9f.centralindia.azurecontainerapps.io"
          else
            CF_BRANCH="staging"
            APP_ENV="staging"
            API_URL="https://jolinx-api-staging.kindsky-ea584b9f.centralindia.azurecontainerapps.io"
            FALLBACK_URL="https://jolinx-api-staging.kindsky-ea584b9f.centralindia.azurecontainerapps.io"
          fi

          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "cf_branch=$CF_BRANCH" >> $GITHUB_OUTPUT
          echo "app_env=$APP_ENV" >> $GITHUB_OUTPUT
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "fallback_url=$FALLBACK_URL" >> $GITHUB_OUTPUT
          echo "::notice title=Deployment Environment::Target: $TARGET | API: $API_URL | CF Branch: $CF_BRANCH"

      - name: Generate target .env, install dependencies & localizations
        run: |
          printf "APP_ENV=%s\nAPI_BASE_URL=%s\nAPI_FALLBACK_URL=%s\n" "${{ steps.cf_env.outputs.app_env }}" "${{ steps.cf_env.outputs.api_url }}" "${{ steps.cf_env.outputs.fallback_url }}" > .env
          flutter pub get
          flutter gen-l10n

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Run Automated Flutter Test Guard (POS, Cart, Auth & Offline DB)
        run: flutter test --no-pub

      - name: Build Android Release APK (arm64)
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties
          flutter build apk --release --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=APP_ENV=${{ steps.cf_env.outputs.app_env }} \
            --dart-define=API_BASE_URL=${{ steps.cf_env.outputs.api_url }} \
            --dart-define=API_FALLBACK_URL=${{ steps.cf_env.outputs.fallback_url }}
          cp build/app/outputs/flutter-apk/app-release.apk jolinx-android.apk

      - name: Download sqlite3.wasm for Web
        run: |
          curl -fSLo web/sqlite3.wasm https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.2/sqlite3.wasm || \
          curl -fSLo web/sqlite3.wasm https://github.com/simolus3/sqlite3.dart/releases/latest/download/sqlite3.wasm

      - name: Build Flutter Web Release
        run: |
          flutter build web --release \
            --pwa-strategy=offline-first \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=APP_ENV=${{ steps.cf_env.outputs.app_env }} \
            --dart-define=API_BASE_URL=${{ steps.cf_env.outputs.api_url }} \
            --dart-define=API_FALLBACK_URL=${{ steps.cf_env.outputs.fallback_url }}
          cp web/sqlite3.wasm build/web/sqlite3.wasm 2>/dev/null || true
          cp web/_redirects build/web/_redirects 2>/dev/null || true
          cp web/_headers build/web/_headers 2>/dev/null || true
          cd build/web && zip -r ../../jolinx-web.zip .

      - name: Deploy Flutter Web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f30c28de87437abbe6b487082c163cc0' }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Deploying to Cloudflare Pages (branch: ${{ steps.cf_env.outputs.cf_branch }})..."
            npx wrangler pages deploy build/web --project-name=jolinx-app --branch="${{ steps.cf_env.outputs.cf_branch }}" --commit-dirty=true
          else
            echo "CLOUDFLARE_API_TOKEN secret not configured yet. Skipping Cloudflare Pages deployment."
          fi

      - name: Publish Staging APK to GitHub Release
        if: steps.cf_env.outputs.target == 'staging'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: "Jolinx Business OS — Staging Build"
          body: |
            Continuous Staging Build for Android & Web:
            - **Target Environment:** Staging
            - **API:** ${{ steps.cf_env.outputs.api_url }}
            - **Web:** https://staging.jolinx-app.pages.dev
            - **Build Number:** ${{ github.run_number }}
          prerelease: true
          files: |
            jolinx-android.apk

      - name: Build Linux Desktop Release
        if: (github.event_name == 'workflow_dispatch' && inputs.build_all_platforms == true) || startsWith(github.ref, 'refs/tags/v')
        run: |
          flutter build linux --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=API_FALLBACK_URL=${{ env.API_FALLBACK_URL }}
          tar -czf jolinx-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Android & Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jolinx-android-web
          path: |
            jolinx-android.apk
            jolinx-web.zip
            jolinx-linux-x64.tar.gz
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Windows Desktop (Windows Runner)
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Desktop
    if: (github.event_name == 'workflow_dispatch' && inputs.build_all_platforms == true) || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Generate production .env, install dependencies & localizations
        run: |
          @(
            "APP_ENV=production"
            "API_BASE_URL=${{ env.API_BASE_URL }}"
            "API_FALLBACK_URL=${{ env.API_FALLBACK_URL }}"
          ) | Set-Content -Path .env -Encoding UTF8
          flutter pub get
          flutter gen-l10n

      - name: Build Windows Release
        run: |
          flutter build windows --release `
            --build-number=${{ github.run_number }} `
            --build-name=1.0.${{ github.run_number }} `
            --dart-define=APP_ENV=production `
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} `
            --dart-define=API_FALLBACK_URL=${{ env.API_FALLBACK_URL }}
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath jolinx-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jolinx-windows
          path: jolinx-windows-x64.zip

  # ──────────────────────────────────────────────────────────────────────────
  # 3. macOS Desktop & iOS Unsigned IPA (macOS Runner)
  # ──────────────────────────────────────────────────────────────────────────
  build-apple:
    name: Build macOS & iOS
    if: (github.event_name == 'workflow_dispatch' && inputs.build_all_platforms == true) || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Generate production .env, install dependencies & localizations
        run: |
          printf "APP_ENV=production\nAPI_BASE_URL=%s\nAPI_FALLBACK_URL=%s\n" "${{ env.API_BASE_URL }}" "${{ env.API_FALLBACK_URL }}" > .env
          flutter pub get
          flutter gen-l10n

      - name: Build macOS Desktop Release
        run: |
          flutter build macos --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=API_FALLBACK_URL=${{ env.API_FALLBACK_URL }}
          cd build/macos/Build/Products/Release && zip -r ../../../../../jolinx-macos.zip business_app.app

      - name: Build iOS Release (Unsigned IPA)
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=API_FALLBACK_URL=${{ env.API_FALLBACK_URL }}
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r jolinx-ios-unsigned.ipa Payload

      - name: Upload macOS & iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jolinx-apple
          path: |
            jolinx-macos.zip
            jolinx-ios-unsigned.ipa

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Publish All 6 Bundles to GitHub Releases
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish to GitHub Release
    if: (github.event_name == 'workflow_dispatch' && inputs.build_all_platforms == true) || startsWith(github.ref, 'refs/tags/v')
    needs: [build-android-web-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Jolinx Business OS — Latest Multi-Platform Build"
          body: |
            Automated multi-platform production release with multi-cloud failover:
            - **Primary API:** `${{ env.API_BASE_URL }}`
            - **Fallback API:** `${{ env.API_FALLBACK_URL }}`
            - **Android Phone/POS:** `jolinx-android.apk`
            - **Windows PC:** `jolinx-windows-x64.zip`
            - **Web Bundle:** `jolinx-web.zip`
            - **Linux Desktop:** `jolinx-linux-x64.tar.gz`
            - **macOS Desktop:** `jolinx-macos.zip`
            - **iOS (Unsigned IPA):** `jolinx-ios-unsigned.ipa`
          prerelease: false
          files: |
            dist/jolinx-android.apk
            dist/jolinx-web.zip
            dist/jolinx-linux-x64.tar.gz
            dist/jolinx-windows-x64.zip
            dist/jolinx-macos.zip
            dist/jolinx-ios-unsigned.ipa
