name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
      - master
      - staging
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  AZURE_RESOURCE_GROUP: rg-jolinx-prod

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Target Environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ inputs.target_env }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            DEPLOY_ENV="production"
          else
            DEPLOY_ENV="staging"
          fi

          if [ "$DEPLOY_ENV" = "production" ]; then
            APP_NAME="jolinx-api"
          else
            APP_NAME="jolinx-api-staging"
          fi

          LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${LOWERCASE_REPO}/jolinx-api"

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "::notice title=Deployment Target::Deploying to '$DEPLOY_ENV' (Container App: $APP_NAME)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.image_name }}:${{ steps.target.outputs.deploy_env }}
            ${{ env.REGISTRY }}/${{ env.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        run: |
          echo "Updating Azure Container App: ${{ steps.target.outputs.app_name }}..."
          az extension add --name containerapp --upgrade --yes

          # Configure ghcr.io registry access on Azure Container App
          az containerapp registry set \
            --name "${{ steps.target.outputs.app_name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

          # Update container app image
          az containerapp update \
            --name "${{ steps.target.outputs.app_name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY }}/${image_name}:${{ steps.target.outputs.deploy_env }}"
